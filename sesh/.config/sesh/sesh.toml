[default_session]
preview_command = "eza --all --git --icons --color=always {}"

[[session]]
name = "Downloads"
path = "~/Downloads"
startup_command = "yazi"

[[session]]
name = "Obsidian"
path = "~/Nextcloud/Documents - Nextcloud/Obsidian/"
startup_command = "nvim ."

[[session]]
name = "home (~)"
path = "~"
disable_startup_command = true

[[session]]
name = "sesh"
path = "~/.config/sesh"
startup_command = "nvim ~/.config/sesh/sesh.toml"

[[session]]
name = "hello_teacher"
path = "~/github/hello_teacher/"
windows = [ "air", "minio",  "postgres"]

[[window]]
name = "postgres"
startup_script = "psql -U postgres -d hello_teacher"

[[window]]
name = "air"
startup_script = "air"

[[window]]
name = "minio"
startup_script = "minio server ~/minio-data --address :9000 --console-address :9001"



[[session]]
name = "tmux"
path = "~/dotfiles/tmux/.config/tmux/"
startup_command = "nvim tmux.conf"
