#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json
[default_session]
preview_command = "eza --all --git --icons --color=always {}"

[[session]]
name = "Downloads"
path = "~/Downloads"
startup_command = "yazi"

[[session]]
name = "Obsidian"
path = "~/Seafile/Obsidian/"
startup_command = "nvim ."

[[session]]
name = "home (~)"
path = "~"
disable_startup_command = true

[[session]]
name = "sesh"
path = "~/.config/sesh"
startup_command = "nvim ~/.config/sesh/sesh.toml"
preview_command = "bat --color=always ~/.config/sesh/sesh.toml"

# Project layout: 1 nvim (session startup_command), 2 claude, then ssh and services
[[window]]
name = "claude"
startup_script = "claude"

[[session]]
name = "hello_teacher"
path = "~/Projects/hello_teacher/"
# Developed on dev-vm (agents via T3 Code there); zsh -i so mise's Go is on PATH
startup_command = '''ssh -t dev@dev-vm 'cd src/hello_teacher && exec zsh -ic "nvim .; exec zsh"' '''
windows = ["dev-vm-claude", "hello-teacher-ubuntu", "air"]

[[window]]
name = "hello-teacher-ubuntu"
startup_script = "ssh deploy@hello-teacher-ubuntu"

# ssh drops TERM_PROGRAM; without it claude never enables extended keys and
# tmux delivers Shift+Enter as plain Enter
[[window]]
name = "dev-vm-claude"
startup_script = '''ssh -t dev@dev-vm 'cd src/hello_teacher && TERM_PROGRAM=tmux exec zsh -ic "claude; exec zsh"' '''

[[window]]
name = "air"
startup_script = '''ssh -t dev@dev-vm 'cd src/hello_teacher && exec zsh -ic "air; exec zsh"' '''

[[session]]
name = "tmux"
path = "~/dotfiles/tmux/.config/tmux/"
startup_command = "nvim tmux.conf"
preview_command = "bat -l tmux --color=always ~/.config/tmux/tmux.conf"

[[session]]
name = "mobilityplus-migration"
path = "~/Projects/mobilityplus-migration/"
startup_command = "nvim"
windows = ["claude", "10.211.76.5", "services"]

[[window]]
name = "10.211.76.5"
startup_script = "clear && ssh sysadmin@10.211.76.5"

[[window]]
name = "services"
startup_script = "dekit mprocs"

[[session]]
name = "home_lab"
path = "~/Projects/home_lab/"
startup_command = "nvim"
windows = ["claude"]

[[session]]
name = "move"
path = "~/Projects/move/"
startup_command = "nvim"
windows = ["claude", "ssh-move-migration"]

[[window]]
name = "ssh-move-migration"
startup_script = "ssh deploy@move-migration"
