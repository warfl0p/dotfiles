[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9
pad=14x14
initial-window-mode=windowed
workers=0
shell=/usr/bin/zsh
login-shell=yes

[scrollback]
multiplier=7.0
lines=10000

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert
primary-paste=none
clipboard-paste=Control+Shift+v Control+v Shift+Insert
fullscreen=F11

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
# Control+BackSpace can't be rebound: foot hardcodes it at the key-encoder
# level to send BS (^H) instead of the usual DEL, unrelated to key-bindings/
# text-bindings, so it never reaches this section. Use Alt+BackSpace instead.
\x17=Mod1+BackSpace
# make ctrl delete also send ctrl+w (delete word before cursor) for claude
\x17=Control+Delete
